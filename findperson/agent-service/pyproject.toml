[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swzr-agent-service"
version = "0.2.0"
description = "首问责任平台 Agent 服务:编排主链 + AGUI 接入 + 知识 MCP + RAG + 反馈回流"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "fastembed>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
agent-server = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]
